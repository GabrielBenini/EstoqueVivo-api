spring:
  application:
    name: EstoqueVivo
  datasource:
    url: jdbc:h2:mem:estoquevivodb
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

#http://localhost:8080/h2-console